<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#275DE1" />
  <title>수원대 캠퍼스 바이크</title>
  <script>
    // 고른 테마(밝게/어둡게)를 화면이 그려지기 전에 적용 (깜빡임 방지). 고른 적 없으면 기기 설정을 따른다
    try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
    // GitHub Pages 는 베타 사이트: 제목 옆에 BETA 표시
    if (location.hostname.endsWith('github.io')) document.documentElement.dataset.beta = '';
  </script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>수원대 캠퍼스 바이크</h1>
    <div class="top-right">
      <button id="locChip" class="chip small" title="위치 기준">데모 위치</button>
      <span id="modeBadge" class="badge walk">도보 모드</span>
      <button id="themeBtn" class="icon-btn" type="button">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="map-wrap">
      <div id="map" aria-label="수원대학교 캠퍼스 지도"></div>

      <!-- 대여 중 남은 시간 -->
      <div id="rentHud" class="rent-hud" hidden>
        <span class="rent-hud-bike"></span>
        <b class="rent-hud-time"></b>
        <div class="bar"><i></i></div>
      </div>

      <div id="pickHint" class="pick-hint" hidden>지도에서 출발 지점을 탭하세요 <button class="chip small" id="pickCancel">취소</button></div>

      <div id="legend" class="legend" hidden>
        <span><i class="lg bike"></i>자전거</span>
        <span><i class="lg walk"></i>도보</span>
        <span><i class="lg foot"></i>보행로</span>
        <span><i class="lg steps"></i>계단</span>
      </div>

      <!-- 안내 중 화면 (지도 + 경로만) -->
      <div id="navHud" class="nav-hud" hidden>
        <div class="nav-leg"></div>
        <div class="nav-main"><b class="nav-remain"></b><span class="nav-sub muted"></span></div>
        <div class="nav-actions">
          <button id="navReturn" class="btn ok" hidden>여기에 반납</button>
          <button id="navStop" class="btn">안내 종료</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="card">
        <div class="od">
          <div class="od-fields">
            <label class="field"><span>출발</span><select id="startSelect"></select></label>
            <label class="field"><span>도착</span><select id="destSelect"></select></label>
          </div>
          <button id="swapBtn" class="swap" aria-label="출발지와 도착지 바꾸기" title="출발/도착 바꾸기">⇅</button>
        </div>
        <div id="routeInfo" class="route-info muted">도착지를 선택하면 경로를 안내합니다.</div>
        <div class="actions">
          <button id="goBtn" class="btn primary" disabled>안내 시작</button>
          <button id="clearBtn" class="btn">지우기</button>
        </div>
      </div>

      <div class="card" id="rentCard"></div>

      <div class="card" id="stationCard" hidden></div>

      <div class="card">
        <div class="tabs">
          <button class="tab active" data-tab="stations">대여소</button>
          <button class="tab" data-tab="bus">버스</button>
          <button class="tab" data-tab="sim" hidden>시뮬레이션</button>
        </div>
        <div id="tab-stations" class="tab-body"><ul id="stationList" class="list"></ul></div>
        <div id="tab-bus" class="tab-body" hidden>
          <div id="busInfo" class="small muted"></div>
          <ul id="busList" class="list"></ul>
        </div>
        <div id="tab-sim" class="tab-body" hidden>
          <div class="muted small">개발용 · 더미 자전거 전체 현황 · GPS 수신 <b id="gpsCount">0</b>건</div>
          <table class="bike-table">
            <thead><tr><th>ID</th><th>상태</th><th>위치</th><th>배터리</th></tr></thead>
            <tbody id="bikeRows"></tbody>
          </table>
          <ol id="log" class="log"></ol>
        </div>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
